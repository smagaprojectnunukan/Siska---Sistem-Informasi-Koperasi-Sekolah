@media print{#login,.row,.bar button,aside{display:none!important}body::before{display:none}body:not(.pr) #app{display:none!important}#app{display:block;background:none;backdrop-filter:none;box-shadow:none;border:0;margin:0}main{padding:0;max-width:none}.card,.tw,.stats div{backdrop-filter:none;box-shadow:none;background:#fff}dialog{box-shadow:none;position:static;width:80mm;backdrop-filter:none}}

 const{data:{session}}=await db.auth.getSession();
 if(!session){$('#login').hidden=0;$('#app').hidden=1;return}

/* ---------- Dasbor ---------- */
async function dash(){
 const s=await rpc('dashboard_summary'),fin=me.role!=='kasir',tz={timeZone:'Asia/Makassar'},day=t=>new Date(t).toLocaleDateString('sv',tz),
 [low,wk,pr]=await Promise.all([q(db.from('v_low_stock').select('*').order('stock').limit(8)),q(db.from('sales').select('sale_date,total').eq('status','posted').gte('sale_date',day(Date.now()-6*864e5)+'T00:00:00+08:00')),q(db.from('products').select('stock,min_stock').eq('is_active',true))]),
 D=[...Array(7)].map((_,i)=>day(Date.now()-(6-i)*864e5)),V=D.map(d=>wk.filter(x=>day(x.sale_date)===d).reduce((m,x)=>m+ +x.total,0)),mx=Math.max(1,...V),
 out=pr.filter(x=>x.stock<1).length,lw=pr.filter(x=>x.stock>=1&&x.stock<=x.min_stock).length,okc=pr.length-out-lw,t=Math.max(1,pr.length),a=okc/t*100,b=a+lw/t*100,
 h=+new Date().toLocaleString('en-GB',{...tz,hour:'2-digit',hourCycle:'h23'}),g=h<11?'Selamat pagi':h<15?'Selamat siang':h<18?'Selamat sore':'Selamat malam',
 sc=(l,v,x='')=>`<div><span>${l}</span><b>${v}</b>${x}</div>`;
 $('#main').innerHTML=`<h1>${g}, ${esc(me.full_name)} 👋</h1><p class=empty>Ringkasan koperasi hari ini</p>
 <div class=stats>${sc('Penjualan hari ini',rp(s.sales_today))}${sc('Transaksi hari ini',s.transactions_today)}${sc('Stok menipis',s.low_stock_count,s.low_stock_count?'<em class="pill warn">Perlu diisi</em>':'<em class="pill ok">Aman</em>')}${fin?sc('Laba kotor hari ini',rp(s.gross_profit_today))+sc('Saldo kas',rp(s.cash_balance)):''}</div>
 <div class=g2><div class=card><h2>Penjualan 7 hari terakhir</h2><div class=bars>${D.map((d,i)=>`<div title="${rp(V[i])}"><b>${V[i]?Math.round(V[i]/1000)+'rb':''}</b><i style="height:${Math.round(V[i]/mx*110)}px"></i><small>${d.slice(8)}/${d.slice(5,7)}</small></div>`).join('')}</div></div>
 <div class=card><h2>Status stok</h2><div class=dn style="background:conic-gradient(#4cb782 0 ${a}%,#f2a33a ${a}% ${b}%,#b9b2c4 ${b}% 100%)"></div><div class=leg><span><i style="background:#4cb782"></i>Tersedia ${okc}</span><span><i style="background:#f2a33a"></i>Menipis ${lw}</span><span><i style="background:#b9b2c4"></i>Habis ${out}</span></div></div></div>
 <h2>Perlu diisi ulang</h2>${tbl(['Barang','Stok','Minimum','Status'],low.map(x=>[x.name,x.stock+' '+x.unit,x.min_stock,{h:x.stock<1?'<span class="pill bad">Habis</span>':'<span class="pill warn">Menipis</span>'}]),'Semua stok aman.')}`}

/* ---------- Kasir (POS) ---------- */
async function pos(){
 P=await q(db.from('products').select('id,name,sku,barcode,sell_price,stock,unit').eq('is_active',true).order('name'));CU=await q(db.from('customers').select('id,name').eq('is_active',true).order('name'));cart=[];dsc=0;pd=0;cu='';
 $('#main').innerHTML=`<div class=pos><div><input id=ps placeholder="Cari nama atau pindai barcode, lalu tekan Enter" oninput=posList() onkeydown="if(event.key==='Enter')posEnter()" autofocus><div id=pl class=plist></div></div><div class=cart><h2 style="margin-top:0">Keranjang</h2><div id=pc></div></div></div>`;posList();posCart()}
function posList(){const s=($('#ps').value||'').toLowerCase();
 $('#pl').innerHTML=P.filter(p=>!s||p.name.toLowerCase().includes(s)||p.barcode===s||p.sku===s).slice(0,60).map(p=>`<button ${p.stock<1?'disabled':''} onclick="add('${p.id}')"><b>${esc(p.name)}</b><span>${rp(p.sell_price)}</span><small>Stok ${p.stock} ${esc(p.unit)}</small></button>`).join('')||'<p class=empty>Barang tidak ditemukan.</p>'}

function add(id){const p=P.find(x=>x.id===id),c=cart.find(x=>x.id===id);
 if(c){if(c.qty<p.stock)c.qty++;else toast('Stok tidak cukup',1)}else cart.push({id,name:p.name,price:+p.sell_price,qty:1,stock:p.stock});posCart()}

 $('#pc').innerHTML=(cart.map(c=>`<div class=ln><span>${esc(c.name)}<br><small>${rp(c.price)}</small></span><span class=q><button class=ghost onclick="qty('${c.id}',-1)">-</button>${c.qty}<button class=ghost style="margin:0 0 0 6px" onclick="qty('${c.id}',1)">+</button></span></div>`).join('')||'<p class=empty>Pilih barang di sebelah kiri.</p>')+
 `<hr><label>Pelanggan (opsional)<select onchange="cu=this.value"><option value="">Umum</option>${CU.map(c=>`<option value="${c.id}" ${c.id===cu?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label><div class=ln><span>Subtotal</span><b id=st></b></div><label>Diskon (Rp)<input type=number min=0 value="${dsc||''}" oninput="dsc=+this.value;pcalc()"></label><div class=ln><span>Total</span><span class=tot id=tt></span></div>
 <label>Uang diterima (Rp)<input type=number min=0 value="${pd||''}" oninput="pd=+this.value;pcalc()"></label><button type=button class=ghost onclick="pd=sub()-dsc;posCart()">Uang pas</button>
 <div class=ln><span>Kembalian</span><b id=cg></b></div><button style="width:100%" onclick=pay() ${cart.length?'':'disabled'}>Bayar</button>`;pcalc()}
function pcalc(){const t=sub()-dsc;$('#st').textContent=rp(sub());$('#tt').textContent=rp(t);$('#cg').textContent=rp(Math.max(0,pd-t))}

 try{const id=await rpc('checkout_sale',{p_items:cart.map(c=>({product_id:c.id,qty:c.qty})),p_customer_id:cu||null,p_discount:dsc,p_paid:pd});toast('Transaksi berhasil');await pos();receipt(id)}finally{busy=0}}

const today=()=>new Date().toLocaleDateString('sv',{timeZone:'Asia/Makassar'});let LAP=[],KR=[],LT='jual';
function lap(){const tab=(k,t)=>`<button class="${LT===k?'':'ghost'}" onclick="LT='${k}';lap()">${t}</button>`;
 $('#main').innerHTML=`<h1>Laporan</h1><div class=bar>${tab('jual','Penjualan')}${tab('kas','Kas')}</div><form class=bar onsubmit=runLap(event)><label>Dari<input type=date name=a value="${today().slice(0,8)}01" required></label><label>Sampai<input type=date name=b value="${today()}" required></label><button>Tampilkan</button><button type=button class=ghost onclick=csv()>Ekspor CSV</button><button type=button class=ghost onclick=printRep()>Cetak / simpan PDF</button></form><div id=lr></div>`;runLap()}
async function runLap(e){e?.preventDefault();if(LT==='kas')return runKas();const a=$('[name=a]').value,b=$('[name=b]').value;
 const r=await q(db.from('v_sale_items_report').select('product_name,qty,revenue,cogs,gross_profit').gte('sale_date',a+'T00:00:00+08:00').lte('sale_date',b+'T23:59:59+08:00').limit(1000));
 const m={};r.forEach(x=>{const o=m[x.product_name]??={n:x.product_name,q:0,r:0,c:0,g:0};o.q+=x.qty;o.r+=+x.revenue;o.c+=+x.cogs;o.g+=+x.gross_profit});
 LAP=Object.values(m).sort((x,y)=>y.q-x.q);const T=k=>LAP.reduce((s,x)=>s+x[k],0);
 $('#lr').innerHTML=`<div class=stats><div><span>Omzet (sebelum diskon)</span><b>${rp(T('r'))}</b></div><div><span>HPP</span><b>${rp(T('c'))}</b></div><div><span>Laba kotor</span><b>${rp(T('g'))}</b></div></div><h2>Barang terlaris</h2>`+
 tbl(['Barang','Terjual','Omzet','Laba kotor'],LAP.map(x=>[x.n,x.q,rp(x.r),rp(x.g)]),'Tidak ada penjualan pada periode ini.')+(r.length>=1000?'<p class=empty>Menampilkan 1.000 baris pertama; persempit periode untuk hasil lengkap.</p>':'')}
function csv(){if(LT==='kas')return csvKas();const t=['Barang,Terjual,Omzet,HPP,Laba kotor',...LAP.map(x=>[`"${x.n.replace(/"/g,'""')}"`,x.q,x.r,x.c,x.g].join(','))].join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/csv'}));a.download='laporan-siska.csv';a.click()}

async function runKas(){const a=$('[name=a]').value,b=$('[name=b]').value;
 KR=await q(db.from('cash_transactions').select('trx_date,type,category,description,amount').gte('trx_date',a+'T00:00:00+08:00').lte('trx_date',b+'T23:59:59+08:00').order('trx_date').limit(1000));
 const S=t=>KR.filter(x=>x.type===t).reduce((s,x)=>s+ +x.amount,0);
 $('#lr').innerHTML=`<div class=stats><div><span>Kas masuk</span><b>${rp(S('in'))}</b></div><div><span>Kas keluar</span><b>${rp(S('out'))}</b></div><div><span>Selisih periode</span><b>${rp(S('in')-S('out'))}</b></div></div><h2>Rincian</h2>`+
 tbl(['Waktu','Jenis','Kategori','Keterangan','Nominal'],KR.map(x=>[dt(x.trx_date),x.type==='in'?'Masuk':'Keluar',x.category,x.description,(x.type==='in'?'+':'-')+rp(x.amount)]),'Tidak ada transaksi kas pada periode ini.')+(KR.length>=1000?'<p class=empty>Menampilkan 1.000 baris pertama; persempit periode untuk hasil lengkap.</p>':'')}
function csvKas(){const c=v=>`"${String(v??'').replace(/"/g,'""')}"`,t=['Waktu,Jenis,Kategori,Keterangan,Nominal',...KR.map(x=>[c(dt(x.trx_date)),x.type==='in'?'Masuk':'Keluar',c(x.category),c(x.description),x.amount].join(','))].join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/csv'}));a.download='kas-siska.csv';a.click()}

async function spPin(){LN=await q(db.from('loans').select('*').order('applied_at',{ascending:false}).limit(200));
 $('#sb').innerHTML=`<div class=bar><button onclick="lnForm()">Ajukan pinjaman</button></div>`+tbl(['No. pinjaman','Anggota','Pokok','Tenor','Total tagihan','Terbayar','Sisa','Status',''],LN.map(l=>{const rem=l.total_payable-l.paid_total;return[l.loan_no,mn(l.member_id),rp(l.principal),l.tenor_months+' bln',rp(l.total_payable),rp(l.paid_total),rp(rem),{h:`<span class="pill ${LS[l.status]}">${l.status}</span>`},{h:l.status==='diajukan'?`<button class=ghost onclick="decide('${l.id}',true)">Setujui</button><button class=ghost onclick="decide('${l.id}',false)">Tolak</button>`:l.status==='berjalan'?`<button class=ghost onclick="lnPay('${l.id}')">Bayar angsuran</button>`:''}]}),'Belum ada pengajuan pinjaman.')}
function lnForm(){dlg(`<h3>Ajukan pinjaman</h3><form oninput="lnCalc(this)" onsubmit="lnSave(event)"><label>Anggota<select name=m required>${opts(MB.filter(m=>m.is_active))}</select></label><label>Pokok pinjaman (Rp)<input name=p type=number min=1 step=any required></label><div class=prow style="grid-template-columns:1fr 1fr"><label>Tenor (bulan)<input name=t type=number min=1 max=60 value=10 required></label><label>Jasa flat per bulan (%)<input name=r type=number min=0 max=100 step=any value=1 required></label></div><label>Keperluan<input name=u></label><p class=empty id=lc></p><div class=row><button type=button class=ghost onclick=closeDlg()>Batal</button><button>Ajukan</button></div></form>`)}
function lnCalc(f){const p=+f.p.value,t=+f.t.value,r=+f.r.value,i=p*r/100*t;$('#lc').textContent=p?`Jasa ${rp(i)} | Total tagihan ${rp(p+i)} | Angsuran sekitar ${rp((p+i)/(t||1))} per bulan`:''}
async function lnSave(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));
 await rpc('loan_apply',{p_member_id:f.m,p_principal:+f.p,p_tenor:+f.t,p_rate:+f.r,p_purpose:f.u||null});closeDlg();toast('Pengajuan tercatat');sp()}
function decide(id,ok){const l=LN.find(x=>x.id===id);dlg(`<h3>${ok?'Setujui dan cairkan':'Tolak'} ${esc(l.loan_no)}</h3><p>${esc(mn(l.member_id))} | ${rp(l.principal)}</p>${ok?'<p class=empty>Dana akan tercatat sebagai kas keluar.</p>':''}<form onsubmit="doDecide(event,'${id}',${ok})"><label>Catatan<input name=n></label><div class=row><button type=button class=ghost onclick=closeDlg()>Kembali</button><button>${ok?'Setujui & cairkan':'Tolak pengajuan'}</button></div></form>`)}
async function doDecide(e,id,ok){e.preventDefault();await rpc('loan_decide',{p_loan_id:id,p_approve:ok,p_note:new FormData(e.target).get('n')||null});closeDlg();toast(ok?'Pinjaman dicairkan, kas keluar tercatat':'Pengajuan ditolak');sp()}
function lnPay(id){const l=LN.find(x=>x.id===id),rem=l.total_payable-l.paid_total,ang=Math.min(rem,Math.ceil(l.total_payable/l.tenor_months));
 dlg(`<h3>Angsuran ${esc(l.loan_no)}</h3><p>${esc(mn(l.member_id))} | Sisa tagihan ${rp(rem)}</p><form onsubmit="doPay(event,'${id}')"><label>Nominal (Rp)<input name=a type=number min=1 max=${rem} step=any value=${ang} required></label><label>Catatan<input name=n></label><div class=row><button type=button class=ghost onclick=closeDlg()>Batal</button><button>Catat pembayaran</button></div></form>`)}
async function doPay(e,id){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));await rpc('loan_pay',{p_loan_id:id,p_amount:+f.a,p_note:f.n||null});closeDlg();toast('Angsuran tercatat dan kas masuk dibuat');sp()}
async function spRiw(){let c=db.from('v_sp_history').select('*').order('trx_date',{ascending:false}).limit(200);if(RM)c=c.eq('member_id',RM);const r=await q(c);
 $('#sb').innerHTML=`<div class=bar><label>Anggota<select onchange="RM=this.value;spRiw()"><option value="">Semua anggota</option>${MB.map(m=>`<option value="${m.id}" ${m.id===RM?'selected':''}>${esc(m.name)}</option>`).join('')}</select></label></div>`+
 tbl(['Waktu','Anggota','Transaksi','Nominal','Catatan'],r.map(x=>[dt(x.trx_date),mn(x.member_id),x.label,(x.direction==='in'?'+':'-')+rp(x.amount),x.note]),'Belum ada transaksi.')}

/* ---------- Pengaturan koperasi (admin) ---------- */
const SF=[['coop_name','Nama koperasi / sekolah'],['coop_address','Alamat'],['receipt_footer','Pesan penutup struk'],['kasir_max_discount_pct','Batas diskon kasir (% dari subtotal)']];
async function setg(){const c=Object.fromEntries((await q(db.from('settings').select('*'))).map(x=>[x.key,x.value]));
 $('#main').innerHTML=`<h1>Pengaturan koperasi</h1><form onsubmit=setSave(event) style="max-width:480px">${SF.map(([k,l])=>`<label>${l}<input name=${k} value="${esc(c[k])}" ${k==='kasir_max_discount_pct'?'type=number min=0 max=100 step=any':''}></label>`).join('')}<p class=empty>Isi batas diskon 0 bila kasir tidak boleh memberi diskon.</p><button>Simpan pengaturan</button></form>`}
async function setSave(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));
 await q(db.from('settings').upsert(SF.map(([k])=>({key:k,value:String(f[k]??'').trim()}))));toast('Pengaturan tersimpan')}

boot();
</script></body></html>
