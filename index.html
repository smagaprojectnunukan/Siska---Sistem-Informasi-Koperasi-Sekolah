function posList(){const s=($('#ps').value||'').toLowerCase();

 if(c){if(c.qty<p.stock)c.qty++;else toast('Stok tidak cukup',1)}else cart.push({id,name:p.name,price:+p.sell_price,qty:1,stock:p.stock});posCart()}

 const[p,s,m]=await Promise.all([q(db.from('products').select('id,name').eq('is_active',true).order('name')),q(db.from('suppliers').select('id,name').eq('is_active',true).order('name')),q(db.from('stock_movements').select('created_at,movement_type,qty_change,stock_after,products(name)').order('created_at',{ascending:false}).limit(30))]);
 OPT=opts(p);const L={purchase:'Barang masuk',sale:'Penjualan',void_sale:'Batal jual',adjust:'Penyesuaian'};
 $('#main').innerHTML=`<h1>Stok masuk</h1><form onsubmit=recv(event)><div class=bar><label style="flex:1">Supplier (opsional)<select id=sup><option value="">-</option>${opts(s)}</select></label><label style="flex:1">Catatan<input id=note></label></div><div id=rows></div><div class=row style="justify-content:flex-start"><button type=button class=ghost onclick=addRow()>Tambah baris</button><button>Simpan penerimaan</button></div></form>
 <h2>Kartu stok terbaru</h2>${tbl(['Waktu','Barang','Jenis','Perubahan','Stok akhir'],m.map(x=>[dt(x.created_at),x.products?.name,L[x.movement_type],x.qty_change>0?'+'+x.qty_change:x.qty_change,x.stock_after]))}`;addRow()}
function addRow(){const d=document.createElement('div');d.className='prow';d.innerHTML=`<select>${OPT}</select><input type=number min=1 placeholder=Jumlah required><input type=number min=0 step=any placeholder="Harga beli satuan" required>`;$('#rows').append(d)}
async function recv(e){e.preventDefault();const items=[...document.querySelectorAll('.prow')].map(r=>{const[s,a,b]=r.children;return{product_id:s.value,qty:+a.value,unit_cost:+b.value}});
 await rpc('receive_purchase',{p_supplier_id:$('#sup').value||null,p_items:items,p_note:$('#note').value||null});toast('Barang masuk tercatat dan kas keluar dibuat');stok()}

 ${tbl(['Waktu','Jenis','Kategori','Keterangan','Nominal','Saldo'],r.map(x=>[dt(x.trx_date),x.type==='in'?'Masuk':'Keluar',x.category,x.description,(x.type==='in'?'+':'-')+rp(x.amount),rp(x.balance)]))}`}

/* ---------- Laporan ---------- */
const today=()=>new Date().toLocaleDateString('sv',{timeZone:'Asia/Makassar'});let LAP=[],KR=[],LT='jual';
function lap(){const tab=(k,t)=>`<button class="${LT===k?'':'ghost'}" onclick="LT='${k}';lap()">${t}</button>`;
 $('#main').innerHTML=`<h1>Laporan</h1><div class=bar>${tab('jual','Penjualan')}${tab('kas','Kas')}</div><form class=bar onsubmit=runLap(event)><label>Dari<input type=date name=a value="${today().slice(0,8)}01" required></label><label>Sampai<input type=date name=b value="${today()}" required></label><button>Tampilkan</button><button type=button class=ghost onclick=csv()>Ekspor CSV</button><button type=button class=ghost onclick=printRep()>Cetak / simpan PDF</button></form><div id=lr></div>`;runLap()}
async function runLap(e){e?.preventDefault();if(LT==='kas')return runKas();const a=$('[name=a]').value,b=$('[name=b]').value;
 const r=await q(db.from('v_sale_items_report').select('product_name,qty,revenue,cogs,gross_profit').gte('sale_date',a+'T00:00:00+08:00').lte('sale_date',b+'T23:59:59+08:00').limit(1000));
 const m={};r.forEach(x=>{const o=m[x.product_name]??={n:x.product_name,q:0,r:0,c:0,g:0};o.q+=x.qty;o.r+=+x.revenue;o.c+=+x.cogs;o.g+=+x.gross_profit});
 LAP=Object.values(m).sort((x,y)=>y.q-x.q);const T=k=>LAP.reduce((s,x)=>s+x[k],0);
 $('#lr').innerHTML=`<div class=stats><div><span>Omzet (sebelum diskon)</span><b>${rp(T('r'))}</b></div><div><span>HPP</span><b>${rp(T('c'))}</b></div><div><span>Laba kotor</span><b>${rp(T('g'))}</b></div></div><h2>Barang terlaris</h2>`+
 tbl(['Barang','Terjual','Omzet','Laba kotor'],LAP.map(x=>[x.n,x.q,rp(x.r),rp(x.g)]),'Tidak ada penjualan pada periode ini.')+(r.length>=1000?'<p class=empty>Menampilkan 1.000 baris pertama; persempit periode untuk hasil lengkap.</p>':'')}
function csv(){if(LT==='kas')return csvKas();const t=['Barang,Terjual,Omzet,HPP,Laba kotor',...LAP.map(x=>[`"${x.n.replace(/"/g,'""')}"`,x.q,x.r,x.c,x.g].join(','))].join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/csv'}));a.download='laporan-siska.csv';a.click()}

async function runKas(){const a=$('[name=a]').value,b=$('[name=b]').value;
 KR=await q(db.from('cash_transactions').select('trx_date,type,category,description,amount').gte('trx_date',a+'T00:00:00+08:00').lte('trx_date',b+'T23:59:59+08:00').order('trx_date').limit(1000));
 const S=t=>KR.filter(x=>x.type===t).reduce((s,x)=>s+ +x.amount,0);
 $('#lr').innerHTML=`<div class=stats><div><span>Kas masuk</span><b>${rp(S('in'))}</b></div><div><span>Kas keluar</span><b>${rp(S('out'))}</b></div><div><span>Selisih periode</span><b>${rp(S('in')-S('out'))}</b></div></div><h2>Rincian</h2>`+
 tbl(['Waktu','Jenis','Kategori','Keterangan','Nominal'],KR.map(x=>[dt(x.trx_date),x.type==='in'?'Masuk':'Keluar',x.category,x.description,(x.type==='in'?'+':'-')+rp(x.amount)]),'Tidak ada transaksi kas pada periode ini.')+(KR.length>=1000?'<p class=empty>Menampilkan 1.000 baris pertama; persempit periode untuk hasil lengkap.</p>':'')}
function csvKas(){const c=v=>`"${String(v??'').replace(/"/g,'""')}"`,t=['Waktu,Jenis,Kategori,Keterangan,Nominal',...KR.map(x=>[c(dt(x.trx_date)),x.type==='in'?'Masuk':'Keluar',c(x.category),c(x.description),x.amount].join(','))].join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/csv'}));a.download='kas-siska.csv';a.click()}
function printRep(){document.body.classList.add('pr');print()}
addEventListener('afterprint',()=>document.body.classList.remove('pr'));

/* ---------- Data master ---------- */
const MS={customers:{t:'Pelanggan',f:[['name','Nama'],['type','Jenis','select:siswa,guru,umum'],['class_unit','Kelas/Unit'],['phone','Telepon']]},suppliers:{t:'Supplier',f:[['name','Nama'],['phone','Telepon'],['address','Alamat']]},categories:{t:'Kategori',f:[['name','Nama']]}};

 tbl([...c.f.map(x=>x[1]),...(cat?[]:['Status']),''],MR.map(r=>[...c.f.map(x=>r[x[0]]),...(cat?[]:[r.is_active?'Aktif':'Nonaktif']),{h:`<button class=ghost onclick="msForm('${r.id}')">Ubah</button>`}]))}
function msForm(id){const c=MS[MT],r=MR.find(x=>x.id===id)||{is_active:true};
 dlg(`<h3>${id?'Ubah':'Tambah'} ${c.t.toLowerCase()}</h3><form onsubmit="msSave(event,'${id||''}')">${c.f.map(([k,l,s])=>`<label>${l}${s?`<select name=${k}>${s.slice(7).split(',').map(o=>`<option ${r[k]===o?'selected':''}>${o}</option>`).join('')}</select>`:`<input name=${k} value="${esc(r[k])}" ${k==='name'?'required':''}>`}</label>`).join('')}${MT==='categories'?'':`<label><input type=checkbox name=is_active style="width:auto" ${r.is_active?'checked':''}> Aktif</label>`}<div class=row><button type=button class=ghost onclick=closeDlg()>Batal</button><button>Simpan</button></div></form>`)}

 MS[MT].f.forEach(([k])=>b[k]=(f[k]||'').trim()||null);if(MT!=='categories')b.is_active=!!f.is_active;
 await q(id?db.from(MT).update(b).eq('id',id):db.from(MT).insert(b));closeDlg();toast('Tersimpan');mst()}

/* ---------- Simpan pinjam ---------- */
let MB=[],SB=[],LN=[],SPT='ang',RM='';
const mn=id=>MB.find(m=>m.id===id)?.name||'-',sv=id=>SB.find(x=>x.member_id===id)||{pokok:0,wajib:0,sukarela:0},tot=id=>+sv(id).pokok+ +sv(id).wajib+ +sv(id).sukarela;
const LS={diajukan:'warn',berjalan:'',lunas:'ok',ditolak:'bad'};
async function sp(){
 [MB,SB]=await Promise.all([q(db.from('members').select('*').order('member_no')),q(db.from('v_member_savings').select('*'))]);
 const tab=(k,t)=>`<button class="${SPT===k?'':'ghost'}" onclick="SPT='${k}';sp()">${t}</button>`;
 $('#main').innerHTML=`<h1>Simpan pinjam</h1><div class=bar>${tab('ang','Anggota')}${tab('sim','Simpanan')}${tab('pin','Pinjaman')}${tab('riw','Riwayat')}</div><div id=sb></div>`;

function spAng(){
 $('#sb').innerHTML=`<div class=bar><button onclick="mbForm()">Tambah anggota</button></div>`+tbl(['No. anggota','Nama','Jenis','Telepon','Total simpanan','Status',''],MB.map(m=>[m.member_no,m.name,m.type,m.phone,rp(tot(m.id)),{h:`<span class="pill ${m.is_active?'ok':''}">${m.is_active?'Aktif':'Nonaktif'}</span>`},{h:`<button class=ghost onclick="mbForm('${m.id}')">Ubah</button><button class="ghost dng" onclick="delMb('${m.id}')">Hapus</button>`}]),'Belum ada anggota.')}
function mbForm(id){const m=MB.find(x=>x.id===id)||{is_active:true,type:'guru'};
 dlg(`<h3>${id?'Ubah':'Tambah'} anggota</h3><form onsubmit="mbSave(event,'${id||''}')"><label>Nama<input name=name required value="${esc(m.name)}"></label><label>Jenis<select name=type>${['guru','siswa','pegawai','umum'].map(t=>`<option ${t===m.type?'selected':''}>${t}</option>`).join('')}</select></label><label>Telepon<input name=phone value="${esc(m.phone)}"></label><label><input type=checkbox name=is_active style="width:auto" ${m.is_active?'checked':''}> Anggota aktif</label><div class=row><button type=button class=ghost onclick=closeDlg()>Batal</button><button>Simpan</button></div></form>`)}
async function mbSave(e,id){e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),b={name:f.name.trim(),type:f.type,phone:f.phone.trim()||null,is_active:!!f.is_active};
 await q(id?db.from('members').update(b).eq('id',id):db.from('members').insert(b));closeDlg();toast('Anggota tersimpan');sp()}
function spSim(){const T=k=>SB.reduce((a,x)=>a+ +x[k],0);
 $('#sb').innerHTML=`<div class=stats><div><span>Simpanan pokok</span><b>${rp(T('pokok'))}</b></div><div><span>Simpanan wajib</span><b>${rp(T('wajib'))}</b></div><div><span>Simpanan sukarela</span><b>${rp(T('sukarela'))}</b></div></div><h2>Saldo per anggota</h2>`+
 tbl(['Anggota','Pokok','Wajib','Sukarela','Total',''],MB.filter(m=>m.is_active).map(m=>{const v=sv(m.id);return[m.name,rp(v.pokok),rp(v.wajib),rp(v.sukarela),rp(tot(m.id)),{h:`<button class=ghost onclick="simForm('${m.id}','in')">Setor</button><button class=ghost onclick="simForm('${m.id}','out')">Tarik</button>`}]}),'Belum ada anggota aktif.')}
function simForm(id,d){dlg(`<h3>${d==='in'?'Setoran':'Penarikan'} simpanan: ${esc(mn(id))}</h3><form onsubmit="simSave(event,'${id}','${d}')"><label>Jenis simpanan<select name=t>${(d==='in'?['pokok','wajib','sukarela']:['sukarela']).map(x=>`<option>${x}</option>`).join('')}</select></label><label>Nominal (Rp)<input name=a type=number min=1 step=any required></label><label>Catatan<input name=n></label>${d==='out'?'<p class=empty>Hanya simpanan sukarela yang dapat ditarik.</p>':''}<div class=row><button type=button class=ghost onclick=closeDlg()>Batal</button><button>Simpan</button></div></form>`)}
async function simSave(e,id,d){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));
 await rpc('savings_move',{p_member_id:id,p_type:f.t,p_direction:d,p_amount:+f.a,p_note:f.n||null});closeDlg();toast('Transaksi simpanan tercatat dan kas diperbarui');sp()}
async function spPin(){LN=await q(db.from('loans').select('*').order('applied_at',{ascending:false}).limit(200));
 $('#sb').innerHTML=`<div class=bar><button onclick="lnForm()">Ajukan pinjaman</button></div>`+tbl(['No. pinjaman','Anggota','Pokok','Tenor','Total tagihan','Terbayar','Sisa','Status',''],LN.map(l=>{const rem=l.total_payable-l.paid_total;return[l.loan_no,mn(l.member_id),rp(l.principal),l.tenor_months+' bln',rp(l.total_payable),rp(l.paid_total),rp(rem),{h:`<span class="pill ${LS[l.status]}">${l.status}</span>`},{h:l.status==='diajukan'?`<button class=ghost onclick="decide('${l.id}',true)">Setujui</button><button class=ghost onclick="decide('${l.id}',false)">Tolak</button>`:l.status==='berjalan'?`<button class=ghost onclick="lnPay('${l.id}')">Bayar angsuran</button>`:''}]}),'Belum ada pengajuan pinjaman.')}
function lnForm(){dlg(`<h3>Ajukan pinjaman</h3><form oninput="lnCalc(this)" onsubmit="lnSave(event)"><label>Anggota<select name=m required>${opts(MB.filter(m=>m.is_active))}</select></label><label>Pokok pinjaman (Rp)<input name=p type=number min=1 step=any required></label><div class=prow style="grid-template-columns:1fr 1fr"><label>Tenor (bulan)<input name=t type=number min=1 max=60 value=10 required></label><label>Jasa flat per bulan (%)<input name=r type=number min=0 max=100 step=any value=1 required></label></div><label>Keperluan<input name=u></label><p class=empty id=lc></p><div class=row><button type=button class=ghost onclick=closeDlg()>Batal</button><button>Ajukan</button></div></form>`)}

async function lnSave(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));
 await rpc('loan_apply',{p_member_id:f.m,p_principal:+f.p,p_tenor:+f.t,p_rate:+f.r,p_purpose:f.u||null});closeDlg();toast('Pengajuan tercatat');sp()}
function decide(id,ok){const l=LN.find(x=>x.id===id);dlg(`<h3>${ok?'Setujui dan cairkan':'Tolak'} ${esc(l.loan_no)}</h3><p>${esc(mn(l.member_id))} | ${rp(l.principal)}</p>${ok?'<p class=empty>Dana akan tercatat sebagai kas keluar.</p>':''}<form onsubmit="doDecide(event,'${id}',${ok})"><label>Catatan<input name=n></label><div class=row><button type=button class=ghost onclick=closeDlg()>Kembali</button><button>${ok?'Setujui & cairkan':'Tolak pengajuan'}</button></div></form>`)}

 dlg(`<h3>Angsuran ${esc(l.loan_no)}</h3><p>${esc(mn(l.member_id))} | Sisa tagihan ${rp(rem)}</p><form onsubmit="doPay(event,'${id}')"><label>Nominal (Rp)<input name=a type=number min=1 max=${rem} step=any value=${ang} required></label><label>Catatan<input name=n></label><div class=row><button type=button class=ghost onclick=closeDlg()>Batal</button><button>Catat pembayaran</button></div></form>`)}
async function doPay(e,id){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));await rpc('loan_pay',{p_loan_id:id,p_amount:+f.a,p_note:f.n||null});closeDlg();toast('Angsuran tercatat dan kas masuk dibuat');sp()}
async function spRiw(){let c=db.from('v_sp_history').select('*').order('trx_date',{ascending:false}).limit(200);if(RM)c=c.eq('member_id',RM);const r=await q(c);

function authMode(m){$('#lf').hidden=m!=='l';$('#rf').hidden=m==='l';$('#lerr').textContent='';$('#rerr').textContent='';return false}
function regMode(v){$('#rs').hidden=v!=='school';$('#rj').hidden=v==='school';$('#rs input').required=v==='school';$('#rj input').required=v!=='school'}
async function register(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),d={full_name:f.name.trim()},r=$('#rerr');r.style.color='';
 if(f.mode==='school')d.school_name=f.school.trim();else d.invite_code=f.code.trim();
 const{data,error}=await db.auth.signUp({email:f.email.trim(),password:f.password,options:{data:d}});
 if(error){r.textContent=f.mode==='join'?'Pendaftaran gagal. Periksa kode undangan dan data Anda.':'Pendaftaran gagal: '+error.message;return}
 if(data.session){boot();return}
 r.style.color='var(--ok)';r.textContent='Pendaftaran berhasil. Jika diminta, cek email untuk konfirmasi, lalu masuk.'}
async function newCode(){await rpc('regenerate_invite_code');toast('Kode undangan diperbarui');setg()}
const ask=(t,m,b,js)=>dlg(`<h3>${t}</h3><p>${m}</p><div class=row><button type=button class=ghost onclick=closeDlg()>Batal</button><button class=danger onclick="${js}">${b}</button></div>`);
function delProd(id){const p=PR.find(x=>x.id===id);ask('Hapus produk?',`Produk <b>${esc(p.name)}</b> akan dihapus permanen. Produk yang sudah pernah terjual atau dibeli tidak dapat dihapus; nonaktifkan saja.`,'Ya, hapus',`doDelProd('${id}')`)}
async function doDelProd(id){await rpc('delete_product',{p_product_id:id});closeDlg();toast('Produk dihapus');prod()}
function delMb(id){const m=MB.find(x=>x.id===id);ask('Hapus anggota?',`Anggota <b>${esc(m.name)}</b> akan dihapus permanen. Anggota yang sudah memiliki transaksi simpanan atau pinjaman tidak dapat dihapus; nonaktifkan saja.`,'Ya, hapus',`doDelMb('${id}')`)}
async function doDelMb(id){await rpc('delete_member',{p_member_id:id});closeDlg();toast('Anggota dihapus');sp()}
function resetAsk(){dlg(`<h3>Reset semua data?</h3><p><b>Dihapus permanen:</b> produk, stok, penjualan, pembelian, kas, pelanggan, supplier, anggota, simpanan, pinjaman, dan angsuran. Pengaturan dan kategori kembali ke awal, nomor nota mulai dari 1.</p><p><b>Tetap ada:</b> akun pengguna, peran, dan kode undangan.</p><p class=empty>Disarankan mengunduh cadangan dulu. Ketik <b>RESET</b> untuk melanjutkan.</p><input autocomplete=off placeholder="Ketik RESET" oninput="$('#rb').disabled=this.value.trim()!=='RESET'"><div class=row><button type=button class=ghost onclick=closeDlg()>Batal</button><button id=rb class=danger disabled onclick=doReset()>Reset sekarang</button></div>`)}
async function doReset(){const b=$('#rb');b.disabled=true;try{await rpc('reset_school_data',{p_confirm:'RESET'})}catch(e){b.disabled=false;return}closeDlg();toast('Data berhasil direset');location.hash='dash'}
async function backupAll(){const T=['settings','categories','products','customers','suppliers','sales','sale_items','purchases','purchase_items','stock_movements','cash_transactions','members','savings_transactions','loans','loan_payments'],out={dibuat:new Date().toISOString(),sekolah_id:me.school_id};
 toast('Menyiapkan cadangan...');
 for(const t of T){let all=[],i=0;for(;;){const r=await q(db.from(t).select('*').order(t==='settings'?'key':'id').range(i,i+999));all=all.concat(r);if(r.length<1000)break;i+=1000}out[t]=all}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(out)],{type:'application/json'}));a.download='cadangan-siska-'+today()+'.json';a.click();toast('Cadangan diunduh')}
const pwT=b=>{const i=b.previousElementSibling;i.type=i.type==='password'?'text':'password';b.classList.toggle('on')};
boot();
</script></body></html>
